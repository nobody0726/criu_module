name: qemu-test

on:
  pull_request:
  push:
    branches: [main]

# GitHub's standard runners have no nested virtualisation, so /dev/kvm is
# absent and QEMU runs in TCG (pure emulation) mode -- roughly 10x slower.
# Three mitigations, in order of importance:
#   1. cache the built 5.10.29 Image, keyed on the config hash
#   2. keep the smoke test small enough for TCG
jobs:
  qemu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev \
            libssl-dev qemu-system-aarch64 cpio busybox-static curl xz-utils

      - name: Cache kernel build
        id: kcache
        uses: actions/cache@v4
        with:
          path: |
            ~/kernels/linux-5.10.29/arch/arm64/boot/Image
            ~/kernels/linux-5.10.29/vmlinux
            ~/kernels/linux-5.10.29/.config
            ~/kernels/linux-5.10.29/Module.symvers
            ~/kernels/linux-5.10.29/scripts
            ~/kernels/linux-5.10.29/include
          key: kernel-5.10.29-${{ hashFiles('scripts/build-kernel.sh') }}

      - name: Build kernel 5.10.29
        if: steps.kcache.outputs.cache-hit != 'true'
        run: ./scripts/build-kernel.sh 5.10.29

      - name: Build module against 5.10.29
        run: make -C kernel_module KDIR="$HOME/kernels/linux-5.10.29"

      - name: Boot QEMU and run module smoke test
        run: |
          timeout 120s ./scripts/run-qemu.sh --ci --script tests/module-smoke.sh 2>&1 | tee qemu.log
          if ! grep -q 'MODULE_SMOKE: PASS' qemu.log; then
            echo "::error::guest module smoke test did not report PASS"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-logs
          path: |
            qemu.log
          if-no-files-found: ignore
